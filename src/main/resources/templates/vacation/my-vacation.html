<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <th:block layout:fragment="head">
        <style>
            .summary-box {
                text-align: center;
                padding: 20px;
                border-radius: 10px;
                color: white;
                font-weight: bold;
            }
            .bg-total { background-color: #4e73df; }
            .bg-used { background-color: #858796; }
            .bg-remaining { background-color: #1cc88a; }
        </style>
    </th:block>
</head>

<body>
<div layout:fragment="content">
    <div class="container-fluid">
        <div class="d-sm-flex align-items-center justify-content-between mb-4">
            <h1 class="h3 mb-0 text-gray-800">나의 휴가</h1>
        </div>

        <!-- 상단 요약 카드 -->
        <div class="row mb-4">
            <div class="col-md-4">
                <div class="summary-box bg-total">
                    <div>총 부여된 휴가</div>
                    <div class="h2" th:text="${vacationInfo.getVacCount()} + '일'"></div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="summary-box bg-used">
                    <div>사용한 휴가</div>
                    <div class="h2" th:text="${vacationInfo.getUsedVacCount()} + '일'"></div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="summary-box bg-remaining">
                    <div>사용 가능한 휴가</div>
                    <div class="h2" th:text="${vacationInfo.getRemainVacCount()} + '일'"></div>
                </div>
            </div>
        </div>

        <!-- 연도 선택 -->
        <div class="dropdown mb-3">
            <button class="btn btn-primary dropdown-toggle" type="button" id="yearDropdown" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                <span th:text="${selectedYear}">2025</span> 년도
            </button>
            <div class="dropdown-menu" aria-labelledby="yearDropdown">
                <a class="dropdown-item" th:each="year : ${years}" th:href="@{/vacation/my(year=${year})}" th:text="${year}">2025</a>
            </div>
        </div>

        <!-- 휴가 상세 내역 -->
        <div class="card shadow mb-4">
            <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary" th:text="${selectedYear} + '년도 휴가 상세내역'">2025년도 휴가 상세내역</h6>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-bordered text-center" width="100%" cellspacing="0">
                        <thead class="thead-light">
                        <tr>
                            <th>구분</th>
                            <th>휴가종류</th>
                            <th>휴가시작일</th>
                            <th>종료일</th>
                            <th>총일수</th>
                            <th>작성일자</th>
                            <th>결재상태</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="vacation, stat : ${vacations}">
                            <td th:text="${stat.count}">1</td>
                            <td th:text="${vacation.type}">연차</td>
                            <td th:text="${vacation.startDate}">2025-04-03</td>
                            <td th:text="${vacation.endDate}">2025-04-04</td>
                            <td th:text="${vacation.totalDays} + '일'">2일</td>
                            <td th:text="${vacation.createdDate}">2025-04-01</td>
                            <td>
                                <span th:if="${vacation.status == '승인완료'}" class="badge badge-success">승인완료</span>
                                <span th:if="${vacation.status == '대기중'}" class="badge badge-warning">대기중</span>
                                <span th:if="${vacation.status == '반려'}" class="badge badge-danger">반려</span>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(vacations)}">
                            <td colspan="7">휴가 신청 내역이 없습니다.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="scripts">
    <!-- JS 추가 필요 시 여기에 -->
</th:block>
</body>
</html>
