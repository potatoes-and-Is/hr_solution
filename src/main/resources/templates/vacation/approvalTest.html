<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>휴가 승인 테스트</title>
</head>
<body>

<h1>휴가 승인 테스트 페이지</h1>

<button id="approveBtn">휴가 승인하기</button>

<script>
  document.getElementById('approveBtn').addEventListener('click', function() {
    fetch('/test/vacation/approve?approvalDocId=6', {
      method: 'POST'
    })
            .then(response => {
              if (!response.ok) {
                throw new Error('승인 실패');
              }
              return response.text();
            })
            .then(data => {
              console.log('승인 성공:', data);
              window.location.href = '/poihr/vacation/my'; // 승인되면 휴가페이지로 이동
            })
            .catch(error => {
              console.error('에러 발생:', error);
              alert('승인 실패');
            });
  });
</script>

</body>
</html>
