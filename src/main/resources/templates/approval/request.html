<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/layout}">
<head>
    <style>
        .report-block {
            border: 1px solid #dee2e6;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            background-color: #f8f9fa;
        }
        .report-row {
            margin-bottom: 10px;
        }
        .report-label {
            font-weight: bold;
            display: inline-block;
            width: 120px;
        }
    </style>
    <th:block layout:fragment="head">
        <link href="https://cdn.datatables.net/1.10.20/css/dataTables.bootstrap4.min.css" rel="stylesheet">
    </th:block>
</head>
<body>
<div layout:fragment="content">
    <!-- Page Heading -->
    <h1 class="h3 mb-2 text-gray-800">전자 결재 보고서</h1>
    <p class="mb-4" th:text="${userName} + '님의 전자 결재 보고서 페이지입니다.'"></p>

    <!-- Report Example -->
    <div class="card shadow mb-4">
        <div class="card-header py-3">
            <h6 class="m-0 font-weight-bold text-primary">결재 내역 상세</h6>
        </div>
        <div class="card-body">
            <form method="post" action="/your-save-endpoint">
                <div class="form-group row">
                    <label for="approvalDocId" class="col-sm-2 col-form-label">결재번호</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" id="approvalDocId" name="approvalDocId" th:value="${approvalDoc.approvalDocId}" readonly>
                    </div>
                </div>

                <div class="form-group row">
                    <label for="documentType" class="col-sm-2 col-form-label">문서유형</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" id="documentType" name="documentType" th:value="${approvalDoc.documentType}">
                    </div>
                </div>

                <div class="form-group row">
                    <label for="title" class="col-sm-2 col-form-label">제목</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" id="title" name="title" th:value="${approvalDoc.title}">
                    </div>
                </div>

                <div class="form-group row">
                    <label for="endDate" class="col-sm-2 col-form-label">기간일</label>
                    <div class="col-sm-10">
                        <input type="date" class="form-control" id="endDate" name="endDate" th:value="${approvalDoc.endDate}">
                    </div>
                </div>

                <div class="form-group row">
                    <label for="content" class="col-sm-2 col-form-label">내용</label>
                    <div class="col-sm-10">
                        <textarea class="form-control" id="content" name="content" rows="3" th:text="${approvalDoc.content}"></textarea>
                    </div>
                </div>

                <div class="form-group row">
                    <label for="reason" class="col-sm-2 col-form-label">사유</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" id="reason" name="reason" th:value="${approvalDoc.reason}">
                    </div>
                </div>

                <div class="form-group row">
                    <label for="vacStartDate" class="col-sm-2 col-form-label">휴가시작일</label>
                    <div class="col-sm-10">
                        <input type="date" class="form-control" id="vacStartDate" name="vacStartDate" th:value="${approvalDoc.vacStartDate}">
                    </div>
                </div>

                <div class="form-group row">
                    <label for="vacEndDate" class="col-sm-2 col-form-label">휴가종료일</label>
                    <div class="col-sm-10">
                        <input type="date" class="form-control" id="vacEndDate" name="vacEndDate" th:value="${approvalDoc.vacEndDate}">
                    </div>
                </div>

                <div class="form-group row">
                    <label for="vacUseDays" class="col-sm-2 col-form-label">휴가사용일수</label>
                    <div class="col-sm-10">
                        <input type="number" step="0.1" class="form-control" id="vacUseDays" name="vacUseDays" th:value="${approvalDoc.vacUseDays}">
                    </div>
                </div>

                <!-- 저장 버튼 -->
                <div class="form-group row">
                    <div class="col-sm-10 offset-sm-2">
                        <button type="submit" class="btn btn-primary">저장</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<th:block layout:fragment="scripts">
    <!-- (DataTables는 여기서 안 써도 됨, 표가 아니니까) -->
</th:block>
</body>
</html>
