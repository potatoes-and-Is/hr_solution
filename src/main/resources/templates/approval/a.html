<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>휴가 결재 문서</title>
  <link href="https://fonts.googleapis.com/css?family=Noto+Sans+KR&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #f8f9fc;
      margin: 40px;
    }
    .form-container {
      background: #ffffff;
      width: 900px;
      margin: auto;
      border: 1px solid #e3e6f0;
      border-radius: 0.35rem;
      padding: 30px;
      position: relative;
      box-shadow: 0 0.15rem 1.75rem 0 rgba(58,59,69,0.15);
    }
    .signatures {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      flex-direction: row;
      gap: 10px;
    }
    .signature-box {
      width: 80px;
      height: 80px;
      border: 1px solid #d1d3e2;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 5px;
      font-size: 12px;
      background-color: #f8f9fc;
      border-radius: 0.35rem;
    }
    .signature-name {
      border-bottom: 1px solid #d1d3e2;
      padding-bottom: 5px;
      font-weight: bold;
      font-size: 11px;
    }
    .signature-sign {
      height: 40px;
      line-height: 40px;
      color: #6c757d;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 120px;
    }
    td, th {
      border: 1px solid #e3e6f0;
      padding: 12px 15px;
      text-align: left;
      font-size: 14px;
    }
    th {
      background-color: #f8f9fc;
      color: #4e73df;
      width: 25%;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #d1d3e2;
      border-radius: 0.35rem;
      font-size: 14px;
      background-color: #f8f9fc;
      box-sizing: border-box;
    }
    textarea {
      resize: vertical;
    }
    .submit-btn {
      margin-top: 30px;
      text-align: center;
    }
    .submit-btn button {
      background-color: #4e73df;
      color: #fff;
      border: none;
      padding: 10px 30px;
      border-radius: 0.35rem;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    .submit-btn button:hover {
      background-color: #2e59d9;
    }
  </style>
  <script>
    function renderSignatures() {
      const approvers = [' ', ' ', ' ']; // 이름은 빈칸, 서명란만
      const container = document.getElementById('signatures');
      container.innerHTML = '';
      approvers.forEach(name => {
        const box = document.createElement('div');
        box.className = 'signature-box';

        const nameDiv = document.createElement('div');
        nameDiv.className = 'signature-name';
        nameDiv.textContent = name;

        const signDiv = document.createElement('div');
        signDiv.className = 'signature-sign';
        signDiv.textContent = '서명';

        box.appendChild(nameDiv);
        box.appendChild(signDiv);

        container.appendChild(box);
      });
    }
    document.addEventListener('DOMContentLoaded', renderSignatures);
  </script>
</head>
<body>

<div class="form-container">

  <div id="signatures" class="signatures">
    <!-- 결재자 박스가 여기에 동적으로 추가됨 -->
  </div>

  <h2 style="color:#4e73df; text-align:center; margin-bottom:30px;">휴가 결재 문서</h2>

  <table>
    <tr>
      <th>제목</th>
      <td><input type="text" placeholder="제목을 입력하세요"></td>
    </tr>
    <tr>
      <th>내용</th>
      <td><textarea placeholder="내용을 입력하세요" rows="3"></textarea></td>
    </tr>
    <tr>
      <th>사유</th>
      <td><textarea placeholder="사유를 입력하세요" rows="5"></textarea></td>
    </tr>
    <tr>
      <th>휴가 기간</th>
      <td>
        <input type="date"> ~ <input type="date">
      </td>
    </tr>
    <tr>
      <th>휴가 사용 일수</th>
      <td><input type="number" min="1" placeholder="사용 일수를 입력하세요"></td>
    </tr>
  </table>

  <div class="submit-btn">
    <button type="button">제출</button>
  </div>

</div>

</body>
</html>
