<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>결재 상세 조회 - 휴가</title>
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f8f9fc;
            margin: 40px;
        }
        .form-container {
            background: #ffffff;
            width: 900px;
            margin: auto;
            border: 1px solid #e3e6f0;
            border-radius: 0.35rem;
            padding: 30px;
            box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.15);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 30px;
        }
        td, th {
            border: 1px solid #e3e6f0;
            padding: 12px 15px;
            text-align: left;
            font-size: 14px;
        }
        th {
            background-color: #f8f9fc;
            color: #4e73df;
            width: 25%;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d3e2;
            border-radius: 0.35rem;
            background-color: #f8f9fc;
        }
        .mt-3 {
            display: flex;
            justify-content: center;
            margin-top: 1rem;
            gap: 10px;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <form>
        <div class="form-container">
            <h2 style="color:#4e73df; text-align:center;">휴가 결재 문서</h2>
            <table>
                <tr>
                    <th>결재번호</th>
                    <td><input type="text" id="approvalDocId" th:value="${approvalDoc.approvalDocId}" readonly></td>
                </tr>
                <tr>
                    <th>문서유형</th>
                    <td><input type="text" th:value="${approvalDoc.docTypeName}" readonly></td>
                </tr>
                <tr>
                    <th>제목</th>
                    <td><input type="text" th:value="${approvalDoc.approvalTitle}" readonly></td>
                </tr>
                <tr>
                    <th>내용</th>
                    <td><textarea rows="3" readonly th:text="${approvalDoc.approvalContent}"></textarea></td>
                </tr>
                <tr>
                    <th>사유</th>
                    <td><textarea rows="5" readonly th:text="${approvalDoc.approvalReason}"></textarea></td>
                </tr>
                <tr>
                    <th>휴가 기간</th>
                    <td>
                        <input type="date" th:value="${approvalDoc.vacReqStart}" readonly> ~
                        <input type="date" th:value="${approvalDoc.vacReqEnd}" readonly>
                    </td>
                </tr>
                <tr>
                    <th>사용 일수</th>
                    <td><input type="text" th:value="${approvalDoc.vacUseDay + '일'}" readonly></td>
                </tr>
            </table>

            <div class="mt-4">
                <label for="comment" style="font-weight: bold;">코멘트</label>
                <textarea id="comment" rows="4" class="form-control" placeholder="의견을 작성하세요..."></textarea>
            </div>

            <div class="mt-3">
                <button type="button" id="approveBtn" class="btn btn-success">승인</button>
                <button type="button" id="rejectBtn" class="btn btn-danger">반려</button>
                <button type="button" class="btn btn-secondary" onclick="location.href='/approval/inboxList'">뒤로가기</button>
            </div>
        </div>
    </form>
</div>

<th:block layout:fragment="scripts">
    <script>
        const approveBtn = document.getElementById('approveBtn');
        const rejectBtn = document.getElementById('rejectBtn');

        function sendApprovalAction(isApproved) {
            const approvalDocId = document.getElementById('approvalDocId').value;
            const comment = document.getElementById('comment').value;

            fetch(`/approval/inbox/detail/${approvalDocId}`, {
                method: 'POST',
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    approved: isApproved,
                    approvalComment: comment,
                })
            }).then(res => {
                if (res.ok) {
                    alert("결재가 처리되었습니다.");
                    location.href = "/approval/inboxList";
                } else {
                    alert("결재 처리 중 오류가 발생했습니다.");
                }
            });
        }

        approveBtn.addEventListener('click', () => sendApprovalAction(true));
        rejectBtn.addEventListener('click', () => sendApprovalAction(false));
    </script>
</th:block>
</body>
</html>
