<!DOCTYPE html>
<html lang="ko">
<head>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>출퇴근 정정 결재 문서</title>
  <link href="https://fonts.googleapis.com/css?family=Noto+Sans+KR&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #f8f9fc;
      margin: 40px;
    }
    .form-container {
      background: #ffffff;
      width: 900px;
      margin: auto;
      border: 1px solid #e3e6f0;
      border-radius: 0.35rem;
      padding: 30px;
      position: relative;
      box-shadow: 0 0.15rem 1.75rem 0 rgba(58,59,69,0.15);
    }
    .signatures {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      flex-direction: row;
      gap: 10px;
    }
    .signature-box {
      width: 80px;
      height: 80px;
      border: 1px solid #d1d3e2;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 5px;
      font-size: 12px;
      background-color: #f8f9fc;
      border-radius: 0.35rem;
    }
    .signature-name {
      border-bottom: 1px solid #d1d3e2;
      padding-bottom: 5px;
      font-weight: bold;
      font-size: 11px;
    }
    .signature-sign {
      height: 40px;
      line-height: 40px;
      color: #6c757d;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 120px;
    }
    td, th {
      border: 1px solid #e3e6f0;
      padding: 12px 15px;
      text-align: left;
      font-size: 14px;
    }
    th {
      background-color: #f8f9fc;
      color: #4e73df;
      width: 25%;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #d1d3e2;
      border-radius: 0.35rem;
      font-size: 14px;
      background-color: #f8f9fc;
      box-sizing: border-box;
    }
    textarea {
      resize: vertical;
    }
    .submit-btn {
      margin-top: 30px;
      text-align: center;
    }
    .submit-btn button {
      background-color: #4e73df;
      color: #fff;
      border: none;
      padding: 10px 30px;
      border-radius: 0.35rem;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    .submit-btn button:hover {
      background-color: #2e59d9;
    }
  </style>
  <script th:inline="javascript">
    /*<![CDATA[*/
    const deptEmpMap = /*[(${deptEmpMapJson})]*/ {};
    /*]]>*/
  </script>
  <script>
    console.log("deptEmpMap: ", deptEmpMap);
    function openApproverModal() {
      $('#approverModal').modal('show');
    }

    // function selectApprovers() {
    //     const selected = [];
    //     document.querySelectorAll('#approverList input:checked').forEach(checkbox => {
    //         selected.push(checkbox.value);
    //     });
    //
    //     // 선택된 이름 보여주기
    //     const selectedDiv = document.getElementById('selectedApprovers');
    //     selectedDiv.innerHTML = selected.map(name => `<span style="margin-right:10px;">${name}</span>`).join('');
    //
    //     // hidden input에 값을 심기 (쉼표로 구분)
    //     document.querySelector('input[name="approverList"]').value = selected.join(',');
    //
    //     $('#approverModal').modal('hide');
    // }

    function loadEmployeesByDepartment() {
      const department = document.getElementById('departmentSelect').value;
      const employeeList = document.getElementById('employeeList');
      employeeList.innerHTML = '';



      const employees = deptEmpMap[department];


      console.log("✅ 선택한 department ID:", department);
      console.log("✅ 가져온 employees:", employees);

      if (!employees) {
        // employees가 없으면 (undefined/null) 함수 끝내버림
        return;
      }

      employees.forEach(emp => {
        const li = document.createElement('li');
        li.innerHTML = `
            <div class="employee-item" style="display: flex; align-items: center; gap: 8px; margin-bottom: 0; padding: 10px 0; border-bottom: 1px solid #dee2e6;">
                <span style="min-width: 100px; white-space: nowrap;">${emp.employeeName}</span>
                <input type="checkbox" value="${emp.employeeName}" data-id="${emp.employeeId}" onchange="toggleEmployee(this)">
            </div>
        `;
        employeeList.appendChild(li);
      });
    }

    let selectedEmployees = [];

    // function toggleEmployee(name, checked) {
    //     const container = document.querySelector(`input[value="${name}"]`).closest('.employee-item');
    //
    //     if (checked) {
    //         if (!selectedEmployees.includes(name)) {
    //             selectedEmployees.push(name); // ✅ 순서대로 추가
    //         }
    //         container.style.fontWeight = "bold";
    //     } else {
    //         selectedEmployees = selectedEmployees.filter(e => e !== name); // ✅ 정확하게 제거
    //         container.style.fontWeight = "";
    //     }
    //
    //     renderSelectedEmployees();
    // }
    function toggleEmployee(checkbox) {
      const name = checkbox.value;
      const id = checkbox.getAttribute('data-id');

      const container = checkbox.closest('.employee-item');
      if (checkbox.checked) {
        if (!selectedEmployees.find(e => e.id === id)) {
          selectedEmployees.push({ id, name });
        }
        container.style.fontWeight = "bold";
      } else {
        selectedEmployees = selectedEmployees.filter(e => e.id !== id);
        container.style.fontWeight = "";
      }
      renderSelectedEmployees();
    }


    function renderSelectedEmployees() {
      const selectedDiv = document.getElementById('selectedEmployees');
      selectedDiv.innerHTML = selectedEmployees
              .map(emp => `
        <span style="
            display: inline-block;
            background-color: #4e73df;
            color: white;
            border-radius: 20px;
            padding: 6px 12px;
            margin: 4px;
            font-size: 14px;
        ">${emp.name}</span>
    `)
              .join('');
    }

    // function confirmApprovers() {
    //     const approverStr = selectedEmployees.join(', ');
    //
    //     // 모달 닫기
    //     $('#approverModal').modal('hide');
    //
    //     // 사용자에게 보여줄 결재자 표시
    //     document.getElementById('approverDisplay').value = approverStr;
    //
    //     // hidden input에 저장
    //     document.querySelector('input[name="approvalLineList"]').value = selectedEmployees.join(',');
    // }

    function confirmApprovers() {
      const form = document.querySelector('form');
      const existingInputs = document.querySelectorAll('input[name^="approvalLineList["]');
      existingInputs.forEach(input => input.remove());

      selectedEmployees.forEach((emp, index) => {
        const hiddenInput = document.createElement('input');
        hiddenInput.type = 'hidden';
        hiddenInput.name = `approvalLineList[${index}].employeeId`;
        hiddenInput.value = emp.id;
        form.appendChild(hiddenInput);
      });

      document.getElementById('approverDisplay').value = selectedEmployees.map(e => e.name).join(', ');
      $('#approverModal').modal('hide');
    }


  </script>
</head>
<body>

<div class="form-container">

  <form th:action="@{/approval/save/fixattend}" method="post" th:object="${ApprovalFixAttendSaveDTO}"> <!-- 여기에 form 추가 -->
    <div id="signatures" class="signatures"></div>

    <h2 style="color:#4e73df; text-align:center; margin-bottom:30px;">출퇴근 정정 결재 문서</h2>
    <input type="hidden" th:field="*{attendId}" th:value="${attendId}">
    <table>

      <tr>
        <th>문서유형</th>
        <td>
          <input type="text" id="docTypeNameInput" class="form-control" readonly>
          <input type="hidden" th:field="*{docTypeCode}" th:value="${docTypeCode}" id="docTypeCodeInput">
        </td>
      </tr>
      <tr>
        <th>제목</th>
        <td>
          <input type="text" th:field="*{approvalTitle}" placeholder="제목을 입력하세요.">
        </td>
      </tr>
      <tr>
        <th>출근일</th>
        <td>
          <input type="date" th:value="${attendDate}" readonly>
          <input type="hidden" th:field="*{attendDate}" th:value="${attendDate}">
        </td>
      </tr>
      <tr>
        <th>기존 출퇴근 시간</th>
        <td>
          <input type="time" th:value="${originCheckInTime}" readonly>
          <input type="time" th:value="${originCheckOutTime}" readonly>
          <input type="hidden" th:field="*{originCheckInTime}" th:value="${originCheckInTime}">
          <input type="hidden" th:field="*{originCheckOutTime}" th:value="${originCheckOutTime}">
        </td>
      </tr>
      <tr>
        <th>변경 출퇴근 시간</th>
        <td>
          <input type="time" th:value="${newCheckInTime}" readonly>
          <input type="time" th:value="${newCheckOutTime}" readonly>
          <input type="hidden" th:field="*{newCheckInTime}" th:value="${newCheckInTime}">
          <input type="hidden" th:field="*{newCheckOutTime}" th:value="${newCheckOutTime}">
        </td>
      </tr>
      <tr>
        <th>내용</th>
        <td>
          <textarea th:field="*{approvalContent}" placeholder="내용을 입력하세요." rows="3"></textarea>
        </td>
      </tr>
      <tr>
        <th>사유</th>
        <td>
          <textarea th:field="*{approvalReason}" placeholder="사유를 입력하세요." rows="5"></textarea>
        </td>
      </tr>
      <tr>
        <th>결재자</th>
        <td>
          <div class="input-group">
            <input type="text" id="approverDisplay" class="form-control bg-light" placeholder="결재자를 선택하세요" readonly>
            <div class="input-group-append">
                <span class="input-group-text" style="cursor:pointer;" onclick="openApproverModal()">
                    <i class="fas fa-user-plus"></i>
                </span>
            </div>
          </div>
          <!--                    <input type="hidden" th:field="*{approvalLineList}">-->
        </td>
      </tr>
    </table>
    <div class="submit-btn">
      <button type="submit">제출</button> <!-- form 안에 submit 버튼 -->
    </div>
  </form>
</div>

<!-- Modal -->
<div class="modal fade" id="approverModal" tabindex="-1" role="dialog">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">결재자 선택</h5>
      </div>
      <div class="modal-body">
        <!-- 부서 선택 드롭박스 -->
        <div class="form-group">
          <label for="departmentSelect">부서 선택</label>
          <select id="departmentSelect" class="form-control" onchange="loadEmployeesByDepartment()">
            <option value="">-- 선택하세요 --</option>
            <option th:each="type : ${approvalEmpLeaveViewDto.deptList}"
                    th:value="${type.getDeptId()}"
                    th:text="${type.getDeptName()}">
            </option>
          </select>
        </div>
        <!-- 사람 리스트 -->
        <ul id="employeeList" style="list-style: none; padding: 0;">
          <!-- 부서 선택하면 여기 채워짐 -->
        </ul>
        <!-- 선택된 사람들 미리보기 -->
        <div id="selectedEmployees" style="margin-top: 10px;">
          <!-- 선택된 결재자 보여주는 영역 -->
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" onclick="confirmApprovers()">선택 완료</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
