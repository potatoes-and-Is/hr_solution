<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/layout}">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://fonts.googleapis.com/css?family=Noto+Sans+KR&display=swap" rel="stylesheet">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>결재 상세 조회</title>
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f8f9fc;
            margin: 40px;
        }

        .form-container {
            background: #ffffff;
            width: 900px;
            margin: auto;
            border: 1px solid #e3e6f0;
            border-radius: 0.35rem;
            padding: 30px;
            position: relative;
            box-shadow: 0 0.15rem 1.75rem 0 rgba(58,59,69,0.15);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 120px;
        }

        td, th {
            border: 1px solid #e3e6f0;
            padding: 12px 15px;
            text-align: left;
            font-size: 14px;
        }

        th {
            background-color: #f8f9fc;
            color: #4e73df;
            width: 25%;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d3e2;
            border-radius: 0.35rem;
            font-size: 14px;
            background-color: #f8f9fc;
            box-sizing: border-box;
        }

        textarea {
            resize: vertical;
        }

        .mt-3 {
            display: flex;
            justify-content: center;
            margin-top: 1rem;
            gap: 10px;
        }
    </style>

    <th:block layout:fragment="head">
        <link href="https://cdn.datatables.net/1.10.20/css/dataTables.bootstrap4.min.css" rel="stylesheet">
    </th:block>
</head>
<body>

<div layout:fragment="content">
    <form>
        <div class="form-container">
            <h2 style="color:#4e73df; text-align:center; margin-bottom:30px;">휴직 결재 문서</h2>
            <table>
                <tr>
                    <th>문서유형</th>
                    <td><input type="text" th:value="${approvalDoc.docTypeName}" readonly></td>
                </tr>
                <tr>
                    <th>제목</th>
                    <td><input type="text" th:value="${approvalDoc.approvalTitle}" readonly></td>
                </tr>
                <tr>
                    <th>내용</th>
                    <td><textarea readonly th:text="${approvalDoc.approvalContent}" rows="3"></textarea></td>
                </tr>
                <tr>
                    <th>사유</th>
                    <td><textarea readonly th:text="${approvalDoc.approvalReason}" rows="5"></textarea></td>
                </tr>
                <tr>
                    <th>휴직일</th>
                    <td>
                        <input type="date" th:value="${approvalDoc.leaveStartDate}" readonly> ~
                        <input type="date" th:value="${approvalDoc.leaveEndDate}" readonly>
                    </td>
                </tr>
                <tr>
                    <th>휴직 종류</th>
                    <td>
                        <select disabled>
                            <option th:text="${approvalDoc.leaveType}"></option>
                        </select>
                    </td>
                </tr>1
            </table>
            <div class="mt-4">
                <label for="comment" style="font-weight: bold;">코멘트</label>
                <textarea id="comment" name="comment" rows="4" class="form-control" placeholder="의견을 작성하세요..."></textarea>
            </div>

            <div class="mt-3">
                <button type="button" id="approveBtn" class="btn btn-success mr-2">승인</button>
                <button type="button" id="rejectBtn" class="btn btn-danger">반려</button>
                <button type="button" class="btn btn-secondary" onclick="location.href='/approval/inboxList'">뒤로가기</button>
            </div>
        </div>
    </form>
</div>

<th:block layout:fragment="scripts">
    <script>
        const approveBtn = document.getElementById('approveBtn');
        const rejectBtn = document.getElementById('rejectBtn');

        function sendApprovalAction(isApproved) {
            const approvalDocId = document.getElementById('approvalDocId')?.value; // null safe
            const comment = document.getElementById('comment').value;

            if (!approvalDocId) {
                alert("approvalDocId가 없습니다.");
                return;
            }

            fetch(`/approval/inbox/detail/${approvalDocId}`, {
                method: 'POST',
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({
                    approved: isApproved,
                    approvalComment: comment,
                })
            }).then(res => {
                if (res.ok) {
                    alert("결재가 처리되었습니다.");
                    location.href = "/approval/inboxList";
                } else {
                    alert("결재 처리 중 오류가 발생했습니다.");
                }
            });
        }

        approveBtn.addEventListener('click', () => sendApprovalAction(true));
        rejectBtn.addEventListener('click', () => sendApprovalAction(false));
    </script>
</th:block>

</body>
</html>
