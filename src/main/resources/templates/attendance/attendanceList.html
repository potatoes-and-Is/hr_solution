<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/layout}">
<head>
    <th:block layout:fragment="head">
        <!-- DataTables CSS -->
        <link href="https://cdn.datatables.net/1.10.20/css/dataTables.bootstrap4.min.css" rel="stylesheet">
    </th:block>
</head>
<body>
<div layout:fragment="content">
    <!-- Page Heading -->
    <h1 class="h3 mb-2 text-gray-800">나의 출퇴근 내역</h1>
    <p class="mb-4">출퇴근 시간 정정요청이 필요한 경우, 필요한 날짜의 체크박스를 눌러 정정요청 폼을 작성해주세요.</p>

    <!-- DataTales Example -->
    <div class="card shadow mb-4">
        <div class="card-header py-3 d-flex justify-content-between align-items-center">
            <h6 class="m-0 font-weight-bold text-primary">Attendance List</h6>
            <button type="button" class="btn btn-primary" data-toggle="modal" data-target="#attendanceFixModal">
                정정요청
            </button>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-bordered" id="dataTable" width="100%" cellspacing="0">
                    <thead>
                    <tr>
                        <th>Id</th>
                        <th>일자</th>
                        <th>출근시각</th>
                        <th>퇴근시각</th>
                        <!--<th>근무시간</th>-->
                        <th>상태</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="attend : ${attendList}">
                        <td th:text="${attend.attendId}"></td>
                        <td th:text="${attend.attendDate}"></td>
                        <td th:text="${attend.checkInTime}"></td>
                        <td th:text="${attend.checkOutTime}"></td>
                        <!--<td th:text="${attend.attendTime}"></td>-->
                        <td th:text="${attend.attendStatus}"></td>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 출퇴근시간 정정 모달 -->
    <div class="modal fade" id="attendanceFixModal" tabindex="-1" role="dialog" aria-labelledby="attendanceFixModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">

                <!-- Modal Header -->
                <div class="modal-header">
                    <h5 class="modal-title" id="attendanceFixModalLabel">출퇴근시간 정정 요청</h5>
                    <button class="close" type="button" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">×</span>
                    </button>
                </div>

                <!-- Modal Body -->
                <div class="modal-body">
                    <form id="attendanceFixForm">

                        <!-- 변경대상 -->
                        <div class="form-group">
                            <label>변경 대상</label>
                            <div class="form-row">
                                <div class="col">
                                    <input type="text" class="form-control" id="originCheckInTime" readonly placeholder="기존 출근시간">
                                </div>
                                <div class="col">
                                    <input type="text" class="form-control" id="originCheckOutTime" readonly placeholder="기존 퇴근시간">
                                </div>
                            </div>
                        </div>

                        <!-- 변경할 시간 -->
                        <div class="form-group">
                            <label>변경할 시간</label>
                            <div class="form-row">
                                <div class="col">
                                    <input type="time" class="form-control" id="newCheckInTime" required>
                                </div>
                                <div class="col">
                                    <input type="time" class="form-control" id="newCheckOutTime" required>
                                </div>
                            </div>
                        </div>

                        <!-- 사유 -->
                        <div class="form-group">
                            <label for="fixReason">사유</label>
                            <textarea class="form-control" id="fixReason" rows="3" placeholder="정정 사유를 입력하세요" required></textarea>
                        </div>

                    </form>
                </div>

                <!-- Modal Footer -->
                <div class="modal-footer">
                    <button class="btn btn-secondary" type="button" data-dismiss="modal">취소</button>
                    <button class="btn btn-primary" id="submitAttendanceFix">결재문서 만들기</button>
                </div>

            </div>
        </div>
    </div>

</div>

<th:block layout:fragment="scripts">
    <!-- DataTables JS -->
    <script src="https://cdn.datatables.net/1.10.20/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.10.20/js/dataTables.bootstrap4.min.js"></script>
    <!-- Page level custom scripts -->
    <script>
        $(document).ready(function() {
            $('#dataTable').DataTable();
        });
    </script>
</th:block>
</body>
</html>
