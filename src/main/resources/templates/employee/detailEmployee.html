<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>직원 상세정보</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
            background-color: #f9f9f9;
            color: #333;
        }

        h2 {
            margin-bottom: 30px;
            font-size: 24px;
            border-bottom: 2px solid #007bff;
            padding-bottom: 10px;
        }

        .info {
            font-size: 16px;
            margin-bottom: 14px;
        }

        .label {
            font-weight: bold;
            display: inline-block;
            width: 140px;
            color: #555;
        }

        /* 버튼 스타일 */
        #actionBtn {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            box-sizing: border-box;
            margin-top: 30px;
        }

        #actionBtn:hover {
            background-color: #0056b3;
        }

        .wrapper {
            max-width: 600px;
            margin: auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.1);
            padding: 30px;
        }
    </style>
</head>

<body>
<div class="wrapper">
    <h2>직원 상세정보</h2>
    <div id="detailContainer"></div>
    <button id="actionBtn" onclick="window.close()">닫기</button>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const employeeId = window.location.pathname.split('/').pop();

        fetch(`/author/${employeeId}`)
            .then(res => {
                if (!res.ok) throw new Error(`응답 오류: ${res.status}`);
                return res.json();
            })
            .then(data => {
                document.getElementById('detailContainer').innerHTML = `
                    <div class="info"><span class="label">이름:</span> ${data.employeeName}</div>
                    <div class="info"><span class="label">부서:</span> ${data.deptName}</div>
                    <div class="info"><span class="label">직급:</span> ${data.levelName}</div>
                    <div class="info"><span class="label">직책:</span> ${data.positionName}</div>
                    <div class="info"><span class="label">이메일:</span> ${data.email}</div>
                    <div class="info"><span class="label">전화번호:</span> ${data.phone}</div>
                    <div class="info"><span class="label">주소:</span> ${data.address}</div>
                    <div class="info"><span class="label">성별:</span> ${data.gender === 'M' ? '남성' : '여성'}</div>
                    <div class="info"><span class="label">상태:</span> ${data.status === 'ACTIVE' ? '재직' : '퇴직'}</div>
                `;
            })
            .catch(err => {
                console.error(err);
                document.getElementById('detailContainer').innerHTML =
                    '<p>직원 정보를 불러올 수 없습니다.</p>';
            });
    });
</script>
</body>
</html>
