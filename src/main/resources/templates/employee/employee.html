<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>직원등록</title>
  <link rel="stylesheet" th:href="@{/css/style2.css}">
</head>
<body>
<div class="content">
  <input type="text" id="email" placeholder="e-mail">
</div>
<div class="content">
  <input type="text" id="identity" placeholder="주민등록번호">
</div>
<div class="content">
  <input type="text" id="phone" placeholder="전화 번호">
</div>
<div class="content">
  <input type="text" id="password" placeholder="비밀번호">
</div>
<div class="content">
  <input type="text" id="address" placeholder="주소">
</div>
<div class="content">
  <input type="text" id="name" placeholder="이름">
</div>
<button id="registerBtn">등록</button>
</body>
</html>
<script>
  document.getElementById('registerBtn').addEventListener('click', function() {
    const employeeData = {
      email: document.getElementById('email').value,
      employeeIdentity: document.getElementById('identity').value,
      phone: document.getElementById('phone').value,
      password: document.getElementById('password').value,
      address: document.getElementById('address').value,
      employeeName: document.getElementById('name').value
      // 자동 세팅 항목은 백엔드에서 처리
    };

    fetch('/author/add', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(employeeData)
    })
            .then(response => {
              if (response.ok) {
                alert('직원 등록 성공!');
                window.close();  // 팝업 닫기
              } else {
                alert('등록 실패!');
              }
            })
            .catch(error => {
              console.error('Error:', error);
              alert('에러 발생!');
            });
  });
</script>
