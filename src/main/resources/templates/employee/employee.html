<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>직원등록</title>
  <link rel="stylesheet" th:href="@{/css/employee.css}">
</head>
<body>
<div class="content">
  <label for="email"></label><input type="text" id="email" placeholder="e-mail">
</div>
<div class="content">
  <label for="identity"></label><input type="text" id="identity" placeholder="주민등록번호">
</div>
<div class="content">
  <label for="phone"></label><input type="text" id="phone" placeholder="전화 번호">
</div>
<div class="content">
  <label for="password"></label><input type="text" id="password" placeholder="비밀번호">
</div>
<div class="content">
  <label for="address"></label><input type="text" id="address" placeholder="주소">
</div>
<div class="content">
  <label for="name"></label><input type="text" id="name" placeholder="이름">
</div>
<button id="registerBtn">등록</button>
<label for="levelSelect">직급</label>
<select id="levelSelect">
  <option value="">선택</option>
</select>
<label for="deptSelect">부서</label>
<select id="deptSelect">
  <option value="">선택</option>
</select>
<label for="positionSelect">직책</label>
<select id="positionSelect">
  <option value="">선택</option>
</select>
<label for="genderSelect"></label>
<select id="genderSelect">
  <option value="M">남성</option>
  <option value="F">여성</option>
</select>
<label for="statusSelect"></label>
<select id="statusSelect">
  <option value="ACTIVE">재직</option>
  <option value="INACTIVE">퇴직</option>
</select>
</body>
</html>
<script>
  // 페이지 로드 시 직급 리스트 가져오기
  document.addEventListener('DOMContentLoaded', function() {
    console.log("팝업 로드 완료 - fetch 실행 시도");

    fetch('/api/levels/list')
            .then(response => response.json())
            .then(data => {
              const levelSelect = document.getElementById('levelSelect');
              data.forEach(level => {
                const option = document.createElement('option');
                option.value = level.level_id;
                option.text = level.level_Name;
                levelSelect.appendChild(option);
              });
            })
            .catch(error => console.error('직급 로드 실패:', error));
    fetch('/api/depts/list')
            .then(response => response.json())
            .then(data => {
              console.log("받은 데이터:", data);   // ⭐ 여기!
              const deptSelect = document.getElementById('deptSelect');
              data.forEach(dept => {
                const option = document.createElement('option');
                option.value = dept.deptId;
                option.text = dept.deptName;
                deptSelect.appendChild(option);
              });
            })
            .catch(error => console.error('부서 로드 실패:', error));
    fetch('/api/positions/list')
            .then(response => response.json())
            .then(data => {
              const posSelect = document.getElementById('positionSelect');
              data.forEach(pos => {
                const option = document.createElement('option');
                option.value = pos.teamPositionId;   // ID 저장
                option.text = pos.positionName;      // 직책명 표시
                posSelect.appendChild(option);
              });
            })
            .catch(error => console.error('직책 로드 실패:', error));

  });

  // 버튼 클릭 시 직원 등록
  document.getElementById('registerBtn').addEventListener('click', function() {
    const employeeData = {
      email: document.getElementById('email').value,
      level: document.getElementById('levelSelect').value,
      deptId: document.getElementById('deptSelect').value,
      positionId: document.getElementById('positionSelect').value,
      gender: document.getElementById('genderSelect').value,
      status: document.getElementById('statusSelect').value,
      identity: document.getElementById('identity').value,
      phone: document.getElementById('phone').value,
      password: document.getElementById('password').value,
      address: document.getElementById('address').value,
      name: document.getElementById('name').value
    };

    fetch('/author/add', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(employeeData)
    })
            .then(response => {
              if (response.ok) {
                alert('직원 등록 성공!');
                window.close();
              } else {
                alert('등록 실패!');
              }
            })
            .catch(error => {
              console.error('Error:', error);
              alert('에러 발생!');
            });
  });
</script>
