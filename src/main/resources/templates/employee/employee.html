<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title id="pageTitle">직원등록</title>
  <link rel="stylesheet" th:href="@{/css/employee.css}">
</head>
<body>
<div class="content">
  <label for="email">이메일</label>
  <input type="text" id="email" placeholder="e-mail">
</div>
<div class="content">
  <label for="identity">주민등록번호</label>
  <input type="text" id="identity" placeholder="주민등록번호">
</div>
<div class="content">
  <label for="phone">전화 번호</label>
  <input type="text" id="phone" placeholder="전화 번호">
</div>
<div class="content">
  <label for="password">비밀번호</label>
  <input type="text" id="password" placeholder="비밀번호">
</div>
<div class="content">
  <label for="address">주소</label>
  <input type="text" id="address" placeholder="주소">
</div>
<div class="content">
  <label for="name">성명</label>
  <input type="text" id="name" placeholder="이름">
  <div class="options-container">
    <label for="levelSelect">직급</label>
    <select id="levelSelect"><option value="">선택</option></select>

    <label for="deptSelect">부서</label>
    <select id="deptSelect"><option value="">선택</option></select>

    <label for="positionSelect">직책</label>
    <select id="positionSelect"><option value="">선택</option></select>

    <label for="genderSelect">성별</label>
    <select id="genderSelect">
      <option value="M">남성</option>
      <option value="F">여성</option>
    </select>

    <label for="statusSelect">상태</label>
    <select id="statusSelect">
      <option value="ACTIVE">재직</option>
      <option value="INACTIVE">퇴직</option>
    </select>

    <!-- 버튼을 옵션 아래로 -->
    <button id="actionBtn">저장</button>
  </div>
</html>
<script>
  // 페이지 로드 시 직급 리스트 가져오기
  document.addEventListener('DOMContentLoaded', async function() {
    const btn = document.getElementById('actionBtn');
    const path = window.location.pathname;

    let mode = 'add';
    let employeeId = null;

    // ✅ 타이틀 동적 변경
    if(path.startsWith('/author/employee/update/')){
      document.getElementById('pageTitle').innerText = '직원 수정';
    }

    await loadSelectOptions();

    if(path.startsWith('/author/employee/update/')){
      mode = 'update';
      employeeId = path.split('/').pop();
      btn.textContent = '수정';

      fetch(`/author/${employeeId}`,{
        method: 'GET', // 또는 'POST', 'PATCH' 등
        headers: {
          'Content-Type': 'application/json'
        }
      })
              .then(response => response.json())
              .then(data => {
                console.log(data); // 응답 데이터 확인
                document.getElementById('email').value = data.email;
                document.getElementById('identity').value = data.employeeIdentity;
                document.getElementById('phone').value = data.phone;
                document.getElementById('password').value = data.password;
                document.getElementById('address').value = data.address;
                document.getElementById('name').value = data.employeeName;
                document.getElementById('genderSelect').value = data.gender;
                document.getElementById('statusSelect').value = data.status;
                document.getElementById('levelSelect').value = data.levelId;
                document.getElementById('deptSelect').value = data.deptId;
                document.getElementById('positionSelect').value = data.positionId;
              })
              .catch(error => console.error('직원 정보 로드 실패:', error));
    }

    // 3️⃣ 버튼 클릭
    btn.addEventListener('click', function() {
      const employeeData = {
        email: document.getElementById('email').value,
        levelId: document.getElementById('levelSelect').value,
        deptId: document.getElementById('deptSelect').value,
        positionId: document.getElementById('positionSelect').value,
        gender: document.getElementById('genderSelect').value,
        status: document.getElementById('statusSelect').value,
        employeeIdentity: document.getElementById('identity').value,
        phone: document.getElementById('phone').value,
        password: document.getElementById('password').value,
        address: document.getElementById('address').value,
        employeeName: document.getElementById('name').value
      };

      const url = (mode === 'update') ? `/author/${employeeId}`  : '/author/add';
      const method = (mode === 'update') ? 'PATCH' : 'POST';

      fetch(url, {
        method: method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(employeeData)
      })
              .then(response => {
                if (response.ok) {
                  alert('직원 등록 성공!');
                  // 부모창 리다이렉트 또는 새로고침
                  if (window.opener && !window.opener.closed) {
                    window.opener.location.href = '/author';   // 부모 창 리다이렉트
                  }
                  window.close();  // 팝업 창 닫기
                } else {
                  alert('직원 등록 실패!');
                }
              })
              .catch(error => {
                console.error('Error:', error);
                alert('에러 발생!');
              });
    });

  });

  // 📌 select 옵션 로드 함수
  async function loadSelectOptions() {
    await fetch('/api/levels/list')
            .then(response => response.json())
            .then(data => {
              const levelSelect = document.getElementById('levelSelect');
              data.forEach(level => {
                const option = document.createElement('option');
                option.value = level.levelId;
                option.text = level.levelName;
                levelSelect.appendChild(option);
              });
            });

    await fetch('/api/depts/list')
            .then(response => response.json())
            .then(data => {
              const deptSelect = document.getElementById('deptSelect');
              data.forEach(dept => {
                const option = document.createElement('option');
                option.value = dept.deptId;
                option.text = dept.deptName;
                deptSelect.appendChild(option);
              });
            });

    await fetch('/api/positions/list')
            .then(response => response.json())
            .then(data => {
              const posSelect = document.getElementById('positionSelect');
              data.forEach(pos => {
                const option = document.createElement('option');
                option.value = pos.teamPositionId;
                option.text = pos.positionName;
                posSelect.appendChild(option);
              });
            });
  }
</script>
