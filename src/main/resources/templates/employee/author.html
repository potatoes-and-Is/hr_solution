<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">

<head>
  <th:block layout:fragment="head">
    <title>인적사항 관리</title>
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/topbar.css}">
  </th:block>
</head>

<body>
<!-- ⭐ 여기에만 너가 만든 내용 집어넣기 -->
<div layout:fragment="content">
  <h1 class="h3 mb-4 text-gray-800">인적사항 관리</h1>

  <!-- 검색바 영역 -->
  <div class="row mb-3">
    <div class="col-auto">
      <select class="form-control" id="searchOption">
        <option>이름</option>
        <option>부서</option>
        <option>직급</option>
      </select>
    </div>
    <div class="col-auto">
      <input type="text" class="form-control" id="searchInput" placeholder="검색어 입력">
    </div>
    <div class="col-auto">
      <button class="btn btn-secondary" id="searchBtn">검색</button>
    </div>
  </div>

  <!-- 테이블 영역 -->
  <div class="table-responsive">
    <table class="table table-hover">
      <thead class="thead-light">
      <tr>
        <th>이름</th>
        <th>부서</th>
        <th>직급</th>
        <th>입사년도</th>
        <th>전화번호</th>
        <th></th>
      </tr>
      </thead>
      <tbody id="employeeTableBody">
      <!-- 데이터 삽입 -->
      </tbody>
    </table>
  </div>

  <!-- 페이징 -->
  <nav aria-label="Page navigation">
    <ul class="pagination justify-content-center">
      <li class="page-item active"><a class="page-link" href="#">1</a></li>
      <li class="page-item"><a class="page-link" href="#">2</a></li>
      <li class="page-item"><a class="page-link" href="#">3</a></li>
    </ul>
  </nav>
</div>

<!-- JS 스크립트 추가 영역 -->
<!-- JS 스크립트 추가 영역 -->
<th:block layout:fragment="scripts">
  <script src="/js/common.js"></script>
  <script src="/js/button.js"></script>
  <script th:inline="javascript">
    const role = [[${role}]];
    const allowedHr = [[${allowedHr}]];
  </script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      let employeesData = []; // 전체 직원 데이터를 저장할 변수
      const employeesPerPage = 5; // 한 페이지당 보여줄 직원 수
      let currentPage = 1; // 현재 페이지 번호

      // 최초 전체 직원 불러오기
      fetch('/author/list')
              .then(response => response.json())
              .then(data => {
                employeesData = data;
                renderTable(employeesData, currentPage); // 테이블 렌더링
                updatePagination(employeesData.length); // 페이징 업데이트
              })
              .catch(error => console.error('직원 목록 불러오기 실패:', error));

      // 검색 버튼 클릭 이벤트
      document.getElementById('searchBtn').addEventListener('click', function () {
        searchEmployees(); // 검색 기능 실행
      });

      // 엔터 키로 검색 기능 실행
      document.getElementById('searchInput').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          searchEmployees(); // 엔터 키를 누르면 검색 기능 실행
        }
      });

      // 검색 기능
      function searchEmployees() {
        const keyword = document.getElementById('searchInput').value.trim();  // 검색어
        const option = document.getElementById('searchOption').value;         // 이름, 부서, 직급 중 선택

        if (!keyword) {
          renderTable(employeesData, currentPage); // 검색어 없으면 전체 출력
          return;
        }

        const filtered = employeesData.filter(employee => {
          if (option === '이름') {
            return employee.employeeName.includes(keyword);
          } else if (option === '부서') {
            return employee.deptName.includes(keyword);
          } else if (option === '직급') {
            return employee.levelName.includes(keyword);
          }
          return false;
        });

        renderTable(filtered, currentPage); // 필터링된 데이터로 테이블 렌더링
        updatePagination(filtered.length); // 페이징 업데이트
      }

      // 테이블 렌더링 함수
      function renderTable(data, page) {
        const tbody = document.getElementById('employeeTableBody');
        tbody.innerHTML = ''; // 기존 데이터 초기화

        // 데이터 계산 (페이지에 맞게)
        const startIndex = (page - 1) * employeesPerPage;
        const endIndex = page * employeesPerPage;
        const pageData = data.slice(startIndex, endIndex);

        pageData.forEach(employee => {
          const row = `
          <tr>
            <td>
              <a href="#" class="employee-author-detail" data-id="${employee.employeeId}">
                ${employee.employeeName}
              </a>
            </td>
            <td>${employee.deptName}</td>
            <td>${employee.levelName}</td>
            <td>${employee.hireDate}</td>
            <td>${employee.phone}</td>
          </tr>`;
          tbody.insertAdjacentHTML('beforeend', row);
        });

        // 권한이 있을 때, 클릭 이벤트 바인딩
        bindClickEvent();
      }

      // 클릭 이벤트 바인딩 (동적으로 렌더링된 링크에 대해 클릭 이벤트 처리)
      function bindClickEvent() {
        document.querySelectorAll('.employee-author-detail').forEach(link => {
          link.addEventListener('click', function (e) {
            e.preventDefault();
            const employeeId = link.dataset.id;

            // 팝업 열기
            openCenteredPopup(`/author/employee/authorDetail/${employeeId}`, '직원 상세정보', 800, 500);
          });
        });
      }

      // 페이징 업데이트
      function updatePagination(totalItems) {
        const totalPages = Math.ceil(totalItems / employeesPerPage);
        const pagination = document.querySelector('.pagination');
        pagination.innerHTML = ''; // 기존 페이징 항목 초기화

        for (let i = 1; i <= totalPages; i++) {
          const pageItem = document.createElement('li');
          pageItem.classList.add('page-item');
          if (i === currentPage) pageItem.classList.add('active');
          pageItem.innerHTML = `<a class="page-link" href="#">${i}</a>`;
          pageItem.addEventListener('click', function (e) {
            e.preventDefault();
            currentPage = i; // 페이지 번호 업데이트
            renderTable(employeesData, currentPage); // 해당 페이지 데이터로 테이블 렌더링
            updatePagination(employeesData.length); // 페이징 업데이트
          });
          pagination.appendChild(pageItem);
        }
      }
    });
  </script>
</th:block>
</body>
</html>
