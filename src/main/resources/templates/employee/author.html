<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">

<head>
  <th:block layout:fragment="head">
    <title>인적사항 관리</title>
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/topbar.css}">
  </th:block>
</head>

<body>
<!-- ⭐ 여기에만 너가 만든 내용 집어넣기 -->
<div layout:fragment="content">
  <h1 class="h3 mb-4 text-gray-800">인적사항 관리</h1>

  <!-- 검색바 + 추가 버튼 영역 -->
  <div class="row mb-3">
    <!-- 직원 추가(저장) 버튼 -->
    <div class="col-auto">
      <button
              th:if="${allowedHr.contains(role)}"
              id="openPopup"
              class="btn btn-primary">
        직원 추가
      </button>
    </div>

    <!-- 기존 검색 옵션 -->
    <div class="col-auto">
      <select class="form-control" id="searchOption">
        <option>이름</option>
        <option>부서</option>
        <option>직급</option>
      </select>
    </div>
    <div class="col-auto">
      <input type="text" class="form-control" id="searchInput" placeholder="검색어 입력">
    </div>
    <div class="col-auto">
      <button class="btn btn-secondary" id="searchBtn">검색</button>
    </div>
  </div>

  <!-- 테이블 영역 -->
  <div class="table-responsive">
    <table class="table table-hover">
      <thead class="thead-light">
      <tr>
        <th>이름</th>
        <th>부서</th>
        <th>직급</th>
        <th>입사년도</th>
        <th>전화번호</th>
        <th>액션</th>  <!-- 수정 버튼 컬럼 추가 -->
      </tr>
      </thead>
      <tbody id="employeeTableBody">
      <!-- 데이터 삽입 -->
      </tbody>
    </table>
  </div>

  <!-- 페이징 -->
  <nav aria-label="Page navigation">
    <ul class="pagination justify-content-center">
      <!-- 페이지 버튼은 스크립트에서 동적으로 생성 -->
    </ul>
  </nav>
</div>

<!-- JS 스크립트 추가 영역 -->
<th:block layout:fragment="scripts">
  <script src="/js/common.js"></script>
  <script src="/js/button.js"></script>
  <script th:inline="javascript">
    const role = [[${role}]];
    const allowedHr = [[${allowedHr}]];
  </script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      let employeesData = [];              // 전체 직원 데이터
      const employeesPerPage = 5;          // 한 페이지당 직원 수
      let currentPage = 1;                 // 현재 페이지 번호
      const showUpdateButton = allowedHr.includes(role);

      // 1) 전체 직원 목록 조회
      fetch('/author/list')
              .then(res => res.json())
              .then(data => {
                employeesData = data;
                filteredData = data;                // ← 최초엔 전체 데이터를 filteredData에 복사
                renderTable(filteredData, currentPage);
                updatePagination(filteredData.length);
              })

      // 2) 직원 추가(저장) 버튼 — 존재할 때만 바인딩
      const openBtn = document.getElementById('openPopup');
      if (openBtn) {
        openBtn.addEventListener('click', () => {
          openCenteredPopup('/author/popup', '직원 등록', 800, 600);
        });
      }

      // 3) 검색 (버튼 클릭 & 엔터)
      const searchBtn = document.getElementById('searchBtn');
      const searchInput = document.getElementById('searchInput');
      if (searchBtn) {
        searchBtn.addEventListener('click', searchEmployees);
      }
      if (searchInput) {
        searchInput.addEventListener('keydown', e => {
          if (e.key === 'Enter') searchEmployees();
        });
      }

      function searchEmployees() {
        const kw = searchInput.value.trim();
        const opt = document.getElementById('searchOption').value;

        filteredData = kw
                ? employeesData.filter(emp => {
                  if (opt === '이름') return emp.employeeName.includes(kw);
                  if (opt === '부서') return emp.deptName.includes(kw);
                  if (opt === '직급') return emp.levelName.includes(kw);
                  return false;
                })
                : employeesData;

        currentPage = 1;
        renderTable(filteredData, currentPage);
        updatePagination(filteredData.length);
      }

      // 4) 테이블 렌더링
      function renderTable(data, page) {
        const tbody = document.getElementById('employeeTableBody');
        tbody.innerHTML = '';
        const start = (page - 1) * employeesPerPage;
        const end   = page * employeesPerPage;

        data.slice(start, end).forEach(emp => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
        <td>
          <a href="#" class="employee-author-detail" data-id="${emp.employeeId}">
            ${emp.employeeName}
          </a>
        </td>
        <td>${emp.deptName}</td>
        <td>${emp.levelName}</td>
        <td>${emp.hireDate}</td>
        <td>${emp.phone}</td>
        <td>
          ${showUpdateButton
                  ? `<button class="btn btn-sm btn-outline-primary update-btn" data-id="${emp.employeeId}">
                 수정
               </button>`
                  : ''}
        </td>`;
          tbody.appendChild(tr);
        });

        bindClickEvent();  // 동적 버튼에 이벤트 바인딩
      }

      // 5) 수정 & 상세보기 클릭 이벤트 바인딩
      function bindClickEvent() {
        document.querySelectorAll('.update-btn').forEach(btn => {
          btn.addEventListener('click', e => {
            const id = e.currentTarget.dataset.id;
            openCenteredPopup(`/author/employee/update/${id}`, '직원 수정', 800, 600);
          });
        });
        document.querySelectorAll('.employee-author-detail').forEach(link => {
          link.addEventListener('click', e => {
            e.preventDefault();
            const id = e.currentTarget.dataset.id;
            openCenteredPopup(`/author/employee/authorDetail/${id}`, '관리자 직원 상세정보', 800, 500);
          });
        });
      }

      // 6) 페이징 생성
      function updatePagination(totalItems) {
        const totalPages = Math.ceil(totalItems / employeesPerPage);
        const ul = document.querySelector('.pagination');
        ul.innerHTML = '';

        for (let i = 1; i <= totalPages; i++) {
          const li = document.createElement('li');
          li.className = 'page-item' + (i === currentPage ? ' active' : '');
          li.innerHTML = `<a class="page-link" href="#">${i}</a>`;
          li.addEventListener('click', e => {
            e.preventDefault();
            currentPage = i;
            renderTable(filteredData, currentPage);         // ← filteredData만 사용
            updatePagination(filteredData.length);          // ← 전체 아이템 수도 filteredData 길이
          });
          ul.appendChild(li);
        }
      }
    });
  </script>
</th:block>
</body>
</html>
